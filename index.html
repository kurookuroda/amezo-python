<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>＠あめぞう</title>
<style>
html, body { height: 100%; margin: 0; }
.wrap { display: flex; height: 100%; }
iframe { border: 0; }
#list { flex: none; width: 220px; height: 100%; border-right: 1px solid #999; }
#naka { flex: 1; min-width: 0; height: 100%; }

/* 幅が狭いとき: 一覧が上、板が下 */
@media (max-width: 700px) {
  .wrap { flex-direction: column; }
  #list { width: 100%; height: 30vh; min-height: 120px; border-right: 0; border-bottom: 1px solid #999; }
  #naka { flex: 1; width: 100%; height: auto; }
}
</style>
</head>
<body>
<div class="wrap">
<iframe id="list" src="dai.cgi" title="板一覧"></iframe>
<iframe id="naka" name="naka" src="main/" title="板"></iframe>
</div>
</body>
</html>
